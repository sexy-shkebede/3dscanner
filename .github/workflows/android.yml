name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-37.0" "build-tools;36.1.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk 3DScanner-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v6
        with:
          name: 3DScanner-apk
          path: |
            3DScanner-${{ github.run_number }}.apk
            app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 3D Scanner build ${{ github.run_number }}
          body: |
            Automatic build from ${{ github.sha }}.
            Install `3DScanner-${{ github.run_number }}.apk` on an ARCore-capable Android 8+ device.
          files: 3DScanner-${{ github.run_number }}.apk
          make_latest: true
